[package]
name = "matrix-screensaver"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A native GPU Matrix rain screensaver"
license = "MIT"
publish = false

[features]
windows-saver-host = []

[[bin]]
name = "matrix-screensaver-scr"
path = "src/bin/matrix-screensaver-scr.rs"
required-features = ["windows-saver-host"]

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
pollster = "0.4.0"
wgpu = "30.0.1"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["wayland", "x11", "rwh_06"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
