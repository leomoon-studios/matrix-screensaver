name: Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build and package
        run: |
          cargo +stable build --release --locked
          scripts/package-linux.sh
      - name: Inspect archive from another working directory
        run: |
          cd "$RUNNER_TEMP"
          cp "$GITHUB_WORKSPACE"/dist/*.tar.gz* .
          sha256sum -c ./*.sha256
          tar -xzf ./*.tar.gz
          test -x ./matrix-screensaver-*/matrix-screensaver
          test -s ./matrix-screensaver-*/LICENSE
          test -s ./matrix-screensaver-*/THIRD-PARTY-NOTICES.md
          test -s ./matrix-screensaver-*/INSTALL.md
          ldd ./matrix-screensaver-*/matrix-screensaver | tee libraries.txt
          ! grep -q 'not found' libraries.txt
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-screensaver-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
